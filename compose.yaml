version: '3.8'

services:
  # FRONTEND: Angular en desarrollo activo (Puerto 4200)
  pos-frontend:
    image: docker.io/library/node:20-alpine
    container_name: sk_pos_angular_dev
    ports:
      - "4200:4200"
    # network_mode: host
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    working_dir: /app
  command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200 --disable-host-check"
  environment:
      - NODE_ENV=development

  # BACKEND: Servidor Web + PHP Nativo (Puerto 8080)
  pos-backend:
    image: docker.io/trafex/php-nginx:latest
    container_name: sk_pos_php_backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html:z
    environment:
      - DB_HOST=${DB_HOST} # 1. Apunta al nombre del servicio.
      - DB_NAME=${DB_NAME} # 2. Debe ser igual a MYSQL_DATABASE.
      - DB_USER=${DB_USER} # 3. Debe ser igual a MYSQL_USER.
      - DB_PASS=${DB_PASS} # 4. Debe ser igual a MYSQL_PASSWORD.

    depends_on:
      - pos-db
    restart: always

  # BASE DE DATOS: MySQL Nativo (Puerto 3306)
  pos-db:
    image: docker.io/library/mysql:8.0
    container_name: sk_pos_mysql
    # Reducir rango a local server
    ports:
      - "127.0.0.1:3306:3306"

    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
    volumes:
      - pos_db_data:/var/lib/mysql:z
      # Se ejecuta de manera automatica la primera vez -v
      - ./docs/db/datos.sql:/docker-entrypoint-initdb.d/01_estructura.sql:z
      - ./docs/db/demos.sql:/docker-entrypoint-initdb.d/02_demo.sql:z
    restart: always

  # ADMINISTRADOR DE BD: phpMyAdmin (Puerto 8081)
  pos-phpmyadmin:
    image: docker.io/library/phpmyadmin:latest
    container_name: sk_pos_phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=${DB_HOST}
      - PMA_USER=${DB_USER}
      - PMA_PASSWORD=${DB_PASS}
    depends_on:
      - pos-db
    restart: always

volumes:
  pos_db_data:
