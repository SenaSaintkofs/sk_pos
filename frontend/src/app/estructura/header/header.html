<header class="h-16 bg-white border-b flex items-center justify-between px-4 sm:px-6 sticky top-0 z-30">
    <div class="flex items-center gap-3">
        <button onclick="toggleMenu()" class="lg:hidden text-2xl">☰</button>
        <div>
            <div class="text-xs text-gray-400 hidden sm:block">Inicio / {{ currentUrl }}</div>
            <h1 class="font-bold text-lg">{{ currentUrl }}</h1>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <button (click)="cerrar()" class="hidden sm:inline-flex items-center gap-2 border border-gray-300 rounded-lg px-3 py-2 text-sm hover:border-red-400 hover:text-red-600">↪
            <span>Cerrar sesión</span>
        </button>
    </div>
</header>
