<aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <!-- Título del POS -->
    <div class="h-16 flex items-center justify-between px-5 border-b">
        <div class="font-extrabold text-xl"><span class="text-red-600">Saint</span>Kofs <span
                class="text-gray-500">POS</span></div><button onclick="toggleMenu()"
            class="lg:hidden text-2xl">×</button>
    </div>
    <nav class="p-4 space-y-1">
        <!-- CONTROL DE ACCESO -->
        @if (rol === 'ADMINISTRADOR' || rol === 'EMPLEADO') {
            @if (rol === 'ADMINISTRADOR') {
                <div class="bg-gray-100 p-2 rounded text-sm text-center font-bold text-gray-700">
                    Módulo de Administración Activo
                </div>

                <a routerLink="/usuarios" routerLinkActive="bg-red-50 text-red-600 font-semibold" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><span class="text-xl">♟</span>Usuarios</a>
            }
            <a routerLink="/dashboard" routerLinkActive="bg-red-50 text-red-600 font-semibold" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><span class="text-xl">▦</span>Dashboard</a>
        }
        
        <!-- Enlaces de Navegación -->
        <a routerLink="/productos" routerLinkActive="bg-red-50 text-red-600 font-semibold" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><span class="text-xl">▣</span>Productos</a>
        <a routerLink="/clientes" routerLinkActive="bg-red-50 text-red-600 font-semibold" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><span class="text-xl">♙</span>Clientes</a>
        <a routerLink="/ventas" routerLinkActive="bg-red-50 text-red-600 font-semibold" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><span class="text-xl">⌁</span>Ventas</a>
        <a routerLink="/categorias" routerLinkActive="bg-red-50 text-red-600 font-semibold" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><span class="text-xl">◈</span>Categorías</a>
        <a routerLink="/pedidos" routerLinkActive="bg-red-50 text-red-600 font-semibold" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100"><span class="text-xl">◫</span>Pedidos</a>
        
        <!-- Botón Inferior de Salida -->
        <div class="absolute bottom-0 left-0 right-0 p-4 border-t">
            <a (click)="cerrar()" class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-red-50 hover:text-red-600"><span class="text-xl">↪</span>Cerrar sesión</a>
        </div>
    </nav>
</aside>
