  url: "{{baseUrl}}/pedido.php?control=editar&id=8"
  params:
    - name: control
      value: editar
      type: query
    - name: id
      value: "8"
      type: query
  body:
    type: json
    data: |
      {
        "id_proveedor": 3,
        "valor_total": 250000,
        "estado_pago": "PAGADO",
        "id_producto": 1,
        "cantidad": 100,
        "costo_unitario": 2500
      }
